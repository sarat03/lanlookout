name: Image to GHCR

# Builds the image: ghcr.io/<owner>/lanlookout
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
    - 'Dockerfile'
    - 'backend/**'

permissions:
  contents: write # tag + GitHub release
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The single version source; the About page shows the same file.
      - name: Read version
        id: ver
        run: |
          v=$(sed 's/^VERSION=//' backend/internal/web/public/version | tr -d '[:space:]')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          git fetch -q --tags
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::warning::v$v is already released, bump backend/internal/web/public/version to release again"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lanlookout:latest
            ghcr.io/${{ github.repository_owner }}/lanlookout:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/lanlookout:${{ steps.ver.outputs.version }}

      - name: Tag and create GitHub release
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.ver.outputs.version }}" --target "${{ github.sha }}" --title "v${{ steps.ver.outputs.version }}" --generate-notes

      # Opens a PR on the Umbrel app store pinning this image, with the same version as the app.
      # Needs secret UMBREL_APPS_TOKEN: fine-grained PAT with Contents + Pull requests write on sarat03/umbrel-apps.
      - name: Open Umbrel app store PR
        if: github.ref == 'refs/heads/main' && steps.ver.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.UMBREL_APPS_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/lanlookout:${{ github.sha }}@${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::warning::UMBREL_APPS_TOKEN not set, skipping Umbrel PR"; exit 0; }
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/umbrel-apps.git" store
          cd store/sarat-watch-your-lan
          sed -i "s#image: ghcr.io/.*/lanlookout:.*#image: ${IMAGE}#" docker-compose.yml
          new=$VERSION
          sed -i "s|^version: \".*\"|version: \"${new}\"|; s|^releaseNotes: .*|releaseNotes: \"See https://github.com/${{ github.repository }}/releases/tag/v${new}\"|" umbrel-app.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b "lanlookout-${new}"
          git commit -qam "Update LanLookout to ${new}"
          git push -q origin "lanlookout-${new}"
          gh pr create --repo ${{ github.repository_owner }}/umbrel-apps --base main --head "lanlookout-${new}" \
            --title "Update LanLookout to ${new}" \
            --body "Pins \`${IMAGE}\` (built from ${{ github.repository }}@${SHA}). Edit releaseNotes before merging if you want."
